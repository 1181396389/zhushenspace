name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: zhushenspace
          path: build/libs/*.jar
